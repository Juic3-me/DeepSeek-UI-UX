name: build-skill

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build README.md and dist/FULL.md
        run: python scripts/build.py --repo "$GITHUB_REPOSITORY"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md dist/FULL.md prompts/START.md
          git diff --cached --quiet || (git commit -m "chore: rebuild skill [skip ci]" && git push)
